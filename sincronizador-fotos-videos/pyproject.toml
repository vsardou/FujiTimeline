[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fujitimeline"
version = "0.1.0"
description = "Metadata-only photo/video synchronization and editable FCPXML export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11,<13",
    "opentimelineio==0.18.1",
    "otio-fcpx-xml-adapter==1.0.0",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fujitimeline = "fujitimeline.cli:main"

[project.gui-scripts]
fujitimeline-gui = "fujitimeline.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fujitimeline = ["assets/*.ico", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
